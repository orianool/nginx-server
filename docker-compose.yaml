services:
  nginx:
    build:
      context: .
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -lc 'echo > /dev/tcp/127.0.0.1/8080'"] # simple health check
      interval: 2s
      timeout: 2s
      retries: 30

  tester:
    build:
      context: ./tests
    environment:
      NGINX_HOST: nginx # nginx resolves to the nginx service
    depends_on:
      nginx:
        condition: service_healthy
