# rate limiting: 
# alocates a different zone for each endpoint-
# 5 requests per per second 
limit_req_zone $binary_remote_addr zone=limit8080:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=limit8081:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=limit8443:10m rate=5r/s;

# status of reached limit
limit_req_status 429;

server {
  listen 8080;
  # for every request return index.html 
  location / {
    # able handle a burst of 5 requests 
    limit_req zone=limit8080 burst=5 nodelay;
    root /usr/share/nginx/html; index index.html; 
    }
}

server {
  listen 8081;
  # on status code 501 return custom_501.html
  error_page 501 /custom_501.html;
  # for every request return status code 501 
  location / { 
    # able handle a burst of 5 requests
    limit_req zone=limit8081 burst=5 nodelay;
    # Use try_files (=501) instead of `return 501` so the request goes through the normal phases and `limit_req` is enforced.
    try_files /__always_missing__ =501;
  }

  location = /custom_501.html {
    root /usr/share/nginx/html;
    internal;
  }
}

# Requests for 8443 will return index.html by default
server {
  listen 8443 ssl;

  ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
  ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

  location / { 
    # able handle a burst of 5 requests
    limit_req zone=limit8443 burst=5 nodelay;
    root /usr/share/nginx/html; index index.html; 
    }
}
